<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoloVision 3D Trifold</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0b1020;
  perspective:4000px;
}

.brochure{
  width:900px;
  height:550px;
  position:relative;
  transform-style:preserve-3d;
}

/* PANEL BASE */
.panel{
  position:absolute;
  width:300px;
  height:100%;
  transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.25,.8,.25,1);
}

/* SIDES */
.side{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:white;
}

.side img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

/* POSITIONS */
#left{
  left:0;
  transform-origin:right;
  z-index:1;
}

#middle{
  left:300px;
  z-index:2;
}

#right{
  left:600px;
  transform-origin:left;
  z-index:3;
}

/* BACK SIDES */
.back{
  transform:rotateY(180deg);
}

/* STATES */

/* CLOSED — everything normal */

/* OPEN COVER */
.open-cover #right{
  transform:rotateY(-180deg);
  z-index:4;
}

/* OPEN FLAP */
.open-flap #left{
  transform:rotateY(180deg);
  z-index:5;
}

</style>
</head>

<body>

<div class="brochure" id="brochure">

  <!-- LEFT PANEL -->
  <div class="panel" id="left">
    <div class="side front">
      <img src="inside-flap.png">
    </div>
    <div class="side back">
      <img src="inside-left.png">
    </div>
  </div>

  <!-- MIDDLE PANEL -->
  <div class="panel" id="middle">
    <div class="side front">
      <img src="inside-middle.png">
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel" id="right">
    <div class="side front">
      <img src="cover.png">
    </div>
    <div class="side back">
      <img src="inside-right.png">
    </div>
  </div>

</div>

<script>

let state = 0;
const brochure = document.getElementById("brochure");

brochure.addEventListener("click", () => {

  if(state === 0){
    brochure.classList.add("open-cover");
    state = 1;
  }
  else if(state === 1){
    brochure.classList.add("open-flap");
    state = 2;
  }
  else{
    brochure.classList.remove("open-flap");
    brochure.classList.remove("open-cover");
    state = 0;
  }

});

</script>

</body>
</html>
