<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloVision · 3D brochure (click cycle)</title>
    <style>
        * {
            margin: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #0b1020;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 4000px;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        .brochure {
            width: 900px;
            height: 560px;
            position: relative;
            transform-style: preserve-3d;
            cursor: pointer;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.6);
            border-radius: 12px;
        }

        /* panel base */
        .panel {
            position: absolute;
            width: 300px;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* sides */
        .side {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            border-radius: 8px;
            box-shadow: inset 0 0 0 1px rgba(255,255,240,0.1);
            overflow: hidden;
        }

        .side img {
            width: 100%;
            height: 100%;
            object-fit: contain;          /* keeps image proportions, cover = fill panel */
            display: block;
            pointer-events: none;
        }

        /* position panels side by side (closed = flat) */
        #left {
            left: 0;
            transform-origin: right center;
            z-index: 1;
        }
        #middle {
            left: 300px;
            z-index: 2;
        }
        #right {
            left: 600px;
            transform-origin: left center;
            z-index: 3;
        }

        /* back face rotated */
        .back {
            transform: rotateY(180deg);
        }

     

        /* state0 (default/closed) – cover only */
        .brochure.state0 #left {
            transform: rotateY(180deg);   /* back = cover facing front */
        }
        .brochure.state0 #middle,
        .brochure.state0 #right {
            visibility: hidden;            /* hide completely, no transition but fine */
            /* also rotate to avoid any flicker */
            transform: rotateY(0deg);
        }

        /* state1 – open cover (shows left front & right back) */
        .brochure.state1 #left {
            transform: rotateY(0deg);       /* inside-left front */
        }
        .brochure.state1 #middle {
            visibility: hidden;              /* middle still hidden */
            transform: rotateY(0deg);
        }
        .brochure.state1 #right {
            transform: rotateY(-180deg);     /* back side = inside-flap forward */
            visibility: visible;
        }

        /* state2 – fully open (all fronts) */
        .brochure.state2 #left {
            transform: rotateY(0deg);        /* inside-left */
        }
        .brochure.state2 #middle {
            visibility: visible;              /* inside-middle appears */
            transform: rotateY(0deg);
        }
        .brochure.state2 #right {
            transform: rotateY(0deg);         /* inside-right front */
            visibility: visible;
        }

        /* small hint */
        .hint {
            position: fixed;
            bottom: 20px;
            color: #9aa8c9;
            font-size: 1.1rem;
            letter-spacing: 1px;
            background: rgba(10, 18, 30, 0.6);
            padding: 8px 20px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid #3f4b6e;
            font-weight: 300;
        }
    </style>
</head>
<body>

<div class="brochure state0" id="brochure">
    <!-- LEFT PANEL -->
    <div class="panel" id="left">
        <div class="side front">
            <img src="inside-left.png">
        </div>
        <div class="side back">
            <img src="cover.png">
        </div>
    </div>

    <!-- MIDDLE PANEL (only front exists) -->
    <div class="panel" id="middle">
        <div class="side front">
            <img src="inside-middle.png">
        </div>
        <!-- no back image – back face white but we won't show it -->
    </div>

    <!-- RIGHT PANEL -->
    <div class="panel" id="right">
        <div class="side front">
            <img src="inside-right.png">
        </div>
        <div class="side back">
            <img src="inside-flap.png">
        </div>
    </div>
</div>

<div class="hint">⚡ Shtype broshurën  -> për ta hapur</div>

<script>
    (function() {
        const brochure = document.getElementById('brochure');
        // states: 0 = closed (cover only), 1 = flap (inside-left + inside-flap), 2 = fully open (all fronts)
        let state = 0;   // initial state0 matches class "state0"

        brochure.addEventListener('click', (e) => {
            e.stopPropagation();   // avoid weird bubbling

            // cycle 0 → 1 → 2 → 0 ...
            if (state === 0) {
                // remove state0, add state1
                brochure.classList.remove('state0');
                brochure.classList.add('state1');
                state = 1;
            } else if (state === 1) {
                brochure.classList.remove('state1');
                brochure.classList.add('state2');
                state = 2;
            } else { // state === 2
                brochure.classList.remove('state2');
                brochure.classList.add('state0');
                state = 0;
            }
        });

        // optional: small touch to ensure initial state class is correct
        // already has state0 in html
    })();
</script>

<!-- note: image sources are inline SVG to show clear labels – no external files needed -->
</body>
</html>
